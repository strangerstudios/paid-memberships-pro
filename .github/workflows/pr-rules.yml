name: Pull request rules

# Checks each pull request against .github/CONTRIBUTING.md and comments with anything missing.
# pull_request_target runs this file from the base branch; the pull request's own code is never checked out or run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rules = require('./.github/scripts/pr-rules.js');
            await rules.run({ github, context, core });

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rules = require('./.github/scripts/pr-rules.js');
            await rules.sweep({ github, context, core });
